<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Feedback Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <!-- Feedback Card -->
        <section class="feedback-card">

            <!-- Header -->
            <div class="form-header">
                <p class="subtitle">YOUR EXPERIENCE MATTERS</p>

                <h1>Hotel Feedback</h1>

                <p>
                    Help us improve your next stay by sharing
                    your experience with us.
                </p>
            </div>


            <!-- Form -->
            <form action="#" method="post">

                <!-- Personal Information -->
                <div class="form-section">

                    <h2>Personal Information</h2>

                    <div class="input-row">

                        <div class="input-group">
                            <label for="name">Full Name</label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Enter your name"
                                required
                            >
                        </div>


                        <div class="input-group">
                            <label for="email">Email Address</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >
                        </div>

                    </div>


                    <div class="input-group">

                        <label for="room">Room Number</label>

                        <input
                            type="number"
                            id="room"
                            name="room"
                            placeholder="e.g. 204"
                            min="1"
                            required
                        >

                    </div>

                </div>


                <!-- Stay Information -->
                <div class="form-section">

                    <h2>Stay Information</h2>

                    <div class="input-group">

                        <label for="visit">Purpose of Visit</label>

                        <select id="visit" name="visit">

                            <option value="">
                                Select an option
                            </option>

                            <option value="business">
                                Business
                            </option>

                            <option value="vacation">
                                Vacation
                            </option>

                            <option value="family">
                                Family Trip
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="input-group">

                        <label>How was your overall experience?</label>

                        <div class="radio-group">

                            <label class="radio-option">
                                <input
                                    type="radio"
                                    name="experience"
                                    value="excellent"
                                    required
                                >
                                Excellent
                            </label>

                            <label class="radio-option">
                                <input
                                    type="radio"
                                    name="experience"
                                    value="good"
                                >
                                Good
                            </label>

                            <label class="radio-option">
                                <input
                                    type="radio"
                                    name="experience"
                                    value="average"
                                >
                                Average
                            </label>

                            <label class="radio-option">
                                <input
                                    type="radio"
                                    name="experience"
                                    value="poor"
                                >
                                Poor
                            </label>

                        </div>

                    </div>

                </div>


                <!-- Services -->
                <div class="form-section">

                    <h2>Services</h2>

                    <div class="input-group">

                        <label>
                            Which services did you use?
                        </label>

                        <div class="checkbox-group">

                            <label class="checkbox-option">
                                <input
                                    type="checkbox"
                                    name="services"
                                    value="restaurant"
                                >
                                Restaurant
                            </label>

                            <label class="checkbox-option">
                                <input
                                    type="checkbox"
                                    name="services"
                                    value="room-service"
                                >
                                Room Service
                            </label>

                            <label class="checkbox-option">
                                <input
                                    type="checkbox"
                                    name="services"
                                    value="spa"
                                >
                                Spa
                            </label>

                            <label class="checkbox-option">
                                <input
                                    type="checkbox"
                                    name="services"
                                    value="gym"
                                >
                                Gym
                            </label>

                        </div>

                    </div>

                </div>


                <!-- Feedback -->
                <div class="form-section">

                    <h2>Your Feedback</h2>

                    <div class="input-group">

                        <label for="feedback">
                            Tell us about your experience
                        </label>

                        <textarea
                            id="feedback"
                            name="feedback"
                            rows="6"
                            placeholder="Write your feedback here..."
                        ></textarea>

                    </div>


                    <div class="input-group">

                        <label for="recommendation">
                            Would you recommend us?
                        </label>

                        <select
                            id="recommendation"
                            name="recommendation"
                        >

                            <option value="">
                                Select an option
                            </option>

                            <option value="yes">
                                Yes, definitely
                            </option>

                            <option value="maybe">
                                Maybe
                            </option>

                            <option value="no">
                                No
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Submit -->
                <button type="submit" class="submit-button">
                    Submit Feedback
                </button>

            </form>

        </section>

    </main>

</body>
</html>

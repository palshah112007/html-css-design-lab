<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Developer Profile Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="profile-card">

        <div class="profile-image">
            <img
                src="./photo.jpeg"
                alt="Developer profile photo"
            >
        </div>

        <h1>Pal Shah</h1>

        <p class="role">Frontend Developer</p>

        <p class="bio">
            Passionate about building clean, responsive and
            user-friendly web experiences.
        </p>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Git</span>
        </div>

        <div class="social-links">
            <a href="#">GitHub</a>
            <a href="#">LinkedIn</a>
        </div>

        <a href="#" class="profile-button">View Profile</a>

    </main>

</body>
</html>
